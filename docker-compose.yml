version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leaktracker
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: leaktracker
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://leaktracker:change_me@db:5432/leaktracker
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "8000:8000"

volumes:
  db_data:
