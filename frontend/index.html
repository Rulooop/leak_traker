<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leak Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14171A;
    --panel:#1B1F23;
    --panel-raised:#23282D;
    --border:#2B3136;
    --paper:#ECE9E2;
    --dim:#8B9298;
    --amber:#E4A64A;
    --amber-soft:rgba(228,166,74,0.14);
    --coral:#E8604C;
    --coral-soft:rgba(232,96,76,0.14);
    --teal:#4FC1B0;
    --teal-soft:rgba(79,193,176,0.14);
    --radius:10px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter', sans-serif;
    font-size:14px;
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2,h3{ font-family:'Space Grotesk', sans-serif; margin:0; letter-spacing:-0.01em; }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  a{ color:inherit; }

  /* ---------- layout ---------- */
  .app{ display:flex; min-height:100vh; }

  .sidebar{
    width:220px;
    flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:20px 14px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    padding:6px 8px 22px 8px;
  }
  .brand svg{ flex-shrink:0; }
  .brand-text{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; letter-spacing:0.02em; }
  .brand-text .slash{ color:var(--amber); }

  .nav{ display:flex; flex-direction:column; gap:2px; flex:1; }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px;
    border-radius:8px;
    color:var(--dim);
    cursor:pointer;
    font-size:13.5px;
    font-weight:500;
    border:none;
    background:transparent;
    text-align:left;
    width:100%;
    transition:background 0.12s ease, color 0.12s ease;
  }
  .nav-item:hover{ background:var(--panel-raised); color:var(--paper); }
  .nav-item.active{ background:var(--amber-soft); color:var(--amber); }
  .nav-item svg{ flex-shrink:0; }

  .sidebar-footer{
    border-top:1px solid var(--border);
    padding-top:14px;
    margin-top:14px;
  }
  .conn-status{
    display:flex; align-items:center; gap:7px;
    font-size:11.5px; color:var(--dim);
    padding:6px 8px 10px 8px;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--dim); flex-shrink:0; }
  .dot.ok{ background:var(--teal); box-shadow:0 0 0 3px var(--teal-soft); }
  .dot.bad{ background:var(--coral); box-shadow:0 0 0 3px var(--coral-soft); }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    padding:22px 32px;
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
  }
  .content{ padding:28px 32px 60px 32px; max-width:980px; }

  /* ---------- primitives ---------- */
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
  }
  .grid-stats{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:14px;
    margin:22px 0 28px 0;
  }
  .stat-card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 18px;
  }
  .stat-value{ font-family:'Space Grotesk', sans-serif; font-size:26px; font-weight:700; }
  .stat-label{ color:var(--dim); font-size:12px; margin-top:4px; }

  label{ display:block; font-size:12.5px; color:var(--dim); margin:14px 0 6px 0; font-weight:500; }
  label:first-child{ margin-top:0; }
  input[type=text], input[type=password], input[type=number], input[type=email], select{
    width:100%; background:var(--panel-raised); border:1px solid var(--border);
    color:var(--paper); border-radius:7px; padding:9px 11px; font-size:13.5px;
    font-family:'Inter', sans-serif;
  }
  input:focus, select:focus{ outline:none; border-color:var(--amber); }
  input[type=file]{
    width:100%; background:var(--panel-raised); border:1px dashed var(--border);
    border-radius:7px; padding:14px 11px; font-size:13px; color:var(--dim);
  }

  button{
    font-family:'Inter', sans-serif; font-weight:600; font-size:13.5px;
    border-radius:7px; border:1px solid transparent; padding:10px 16px;
    cursor:pointer; transition:filter 0.12s ease;
  }
  button:hover{ filter:brightness(1.08); }
  button:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
  .btn-primary{ background:var(--amber); color:#1A1300; }
  .btn-ghost{ background:var(--panel-raised); color:var(--paper); border-color:var(--border); }
  .btn-block{ width:100%; margin-top:18px; }

  table{ width:100%; border-collapse:collapse; }
  th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--dim); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border);
  }
  td{ padding:10px; border-bottom:1px solid var(--border); font-size:13px; }
  tr:last-child td{ border-bottom:none; }
  .badge{
    display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px;
    font-size:11px; font-weight:600; font-family:'IBM Plex Mono', monospace;
  }
  .badge.leak{ background:var(--coral-soft); color:var(--coral); }
  .badge.clean{ background:var(--teal-soft); color:var(--teal); }

  .empty{ color:var(--dim); font-size:13px; padding:26px 4px; text-align:center; }

  .section-title{ font-size:12px; text-transform:uppercase; letter-spacing:0.05em; color:var(--dim); margin:30px 0 12px 0; }
  .section-title:first-child{ margin-top:0; }

  .banner{
    position:fixed; top:18px; right:18px; z-index:50;
    background:var(--panel-raised); border:1px solid var(--border); border-left:3px solid var(--coral);
    border-radius:8px; padding:12px 16px; font-size:13px; max-width:340px;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }

  .result-panel{
    border-radius:var(--radius); padding:26px; text-align:center; margin-top:20px;
  }
  .result-panel.leak{ background:var(--coral-soft); border:1px solid var(--coral); }
  .result-panel.clean{ background:var(--teal-soft); border:1px solid var(--teal); }
  .result-title{ font-family:'Space Grotesk', sans-serif; font-size:19px; font-weight:700; margin-bottom:6px; }
  .result-panel.leak .result-title{ color:var(--coral); }
  .result-panel.clean .result-title{ color:var(--teal); }
  .result-detail{ font-size:13px; color:var(--paper); opacity:0.85; }

  .hero{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px 22px 14px 22px; margin-bottom:24px;
  }
  .hero-label{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--dim); margin-bottom:10px; }

  .settings-row{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
  .settings-row > div{ flex:1; min-width:200px; }

  @media (max-width: 760px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; flex-direction:row; align-items:center; padding:12px 16px; overflow-x:auto; }
    .brand{ padding:0 14px 0 0; }
    .nav{ flex-direction:row; }
    .sidebar-footer{ display:none; }
    .grid-stats{ grid-template-columns:repeat(2, 1fr); }
    .content{ padding:20px; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <rect width="26" height="26" rx="6" fill="#E4A64A" fill-opacity="0.14"/>
        <path d="M5 15V11M9 18V8M13 20V6M17 16V10M21 14V12" stroke="#E4A64A" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <div class="brand-text">LEAK<span class="slash">//</span>TRACKER</div>
    </div>

    <nav class="nav">
      <button class="nav-item" data-view="dashboard">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="1.5" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.4"/><rect x="8.5" y="1.5" width="6" height="9" rx="1.2" stroke="currentColor" stroke-width="1.4"/><rect x="1.5" y="9.5" width="6" height="5" rx="1.2" stroke="currentColor" stroke-width="1.4"/></svg>
        Dashboard
      </button>
      <button class="nav-item" data-view="new-track">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Nueva canción
      </button>
      <button class="nav-item" data-view="verify">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8.5l3.5 3.5L14 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Verificar filtración
      </button>
      <button class="nav-item" data-view="recipients">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 14c0-2.8 2.5-5 5.5-5s5.5 2.2 5.5 5" stroke="currentColor" stroke-width="1.4"/></svg>
        Destinatarios
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="conn-status">
        <span class="dot" id="connDot"></span>
        <span id="connText">sin comprobar</span>
      </div>
      <button class="nav-item" data-view="settings" style="font-size:12px;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.5v2M8 12.5v2M14.5 8h-2M3.5 8h-2M12.5 3.5l-1.4 1.4M4.9 11.1l-1.4 1.4M12.5 12.5l-1.4-1.4M4.9 4.9L3.5 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        Ajustes de conexión
      </button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="pageTitle" style="font-size:19px;">Dashboard</h1>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
/* ---------- estado y config ---------- */
const state = {
  apiUrl: localStorage.getItem('lt_apiUrl') || 'http://localhost:8000',
  apiKey: localStorage.getItem('lt_apiKey') || '',
  view: 'dashboard',
  recipients: [],
};

function saveConfig(url, key){
  state.apiUrl = url.replace(/\/$/, '');
  state.apiKey = key;
  localStorage.setItem('lt_apiUrl', state.apiUrl);
  localStorage.setItem('lt_apiKey', state.apiKey);
}

async function api(path, options = {}){
  const res = await fetch(state.apiUrl + path, {
    ...options,
    headers: {
      ...(options.headers || {}),
      'X-API-Key': state.apiKey,
    },
  });
  if(!res.ok){
    let detail = res.statusText;
    try{ detail = (await res.json()).detail || detail; }catch(e){}
    throw new Error(detail);
  }
  const contentType = res.headers.get('content-type') || '';
  return contentType.includes('application/json') ? res.json() : res;
}

async function downloadWatermarkedFile(id, filename){
  try{
    const res = await api(`/watermarked-files/${id}/download`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }catch(e){
    showError(e.message);
  }
}

function showError(msg){
  const el = document.createElement('div');
  el.className = 'banner';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

async function checkConnection(){
  const dot = document.getElementById('connDot');
  const text = document.getElementById('connText');
  try{
    await api('/stats');
    dot.className = 'dot ok';
    text.textContent = 'conectado';
    return true;
  }catch(e){
    dot.className = 'dot bad';
    text.textContent = 'sin conexión';
    return false;
  }
}

/* ---------- navegación ---------- */
document.querySelectorAll('.nav-item[data-view]').forEach(btn => {
  btn.addEventListener('click', () => navigate(btn.dataset.view));
});

const titles = {
  dashboard: 'Dashboard',
  'new-track': 'Nueva canción',
  verify: 'Verificar filtración',
  recipients: 'Destinatarios',
  settings: 'Ajustes de conexión',
};

function navigate(view){
  state.view = view;
  document.getElementById('pageTitle').textContent = titles[view];
  document.querySelectorAll('.nav-item[data-view]').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });
  render();
}

/* ---------- render principal ---------- */
async function render(){
  const el = document.getElementById('content');
  el.innerHTML = '<div class="empty">Cargando…</div>';
  try{
    if(state.view === 'dashboard') return renderDashboard(el);
    if(state.view === 'new-track') return renderNewTrack(el);
    if(state.view === 'verify') return renderVerify(el);
    if(state.view === 'recipients') return renderRecipients(el);
    if(state.view === 'settings') return renderSettings(el);
  }catch(e){
    el.innerHTML = `<div class="empty">No se ha podido cargar: ${e.message}</div>`;
  }
}

/* ---------- waveform hero (elemento firma) ---------- */
function waveformSVG(){
  // Genera una forma de onda pseudo-aleatoria pero determinista, con un
  // tramo marcado como "zona de watermark" (alta frecuencia, poca amplitud)
  const bars = [];
  const n = 64;
  for(let i = 0; i < n; i++){
    const inWatermarkZone = i >= 46 && i <= 54;
    let h;
    if(inWatermarkZone){
      h = 6 + (i % 3) * 2; // tramo de watermark: bajito y regular
    }else{
      h = 8 + Math.round(18 * Math.abs(Math.sin(i * 0.45)) + (i % 7));
    }
    const x = 6 + i * 9;
    const color = inWatermarkZone ? 'var(--amber)' : 'var(--dim)';
    bars.push(`<rect x="${x}" y="${34 - h/2}" width="4" height="${h}" rx="1.5" fill="${color}" opacity="${inWatermarkZone ? '1' : '0.55'}"/>`);
  }
  return `
  <svg width="100%" height="70" viewBox="0 0 590 68" preserveAspectRatio="xMidYMid meet">
    ${bars.join('')}
    <line x1="418" y1="4" x2="418" y2="60" stroke="var(--amber)" stroke-width="1" stroke-dasharray="2,3" opacity="0.6"/>
    <line x1="484" y1="4" x2="484" y2="60" stroke="var(--amber)" stroke-width="1" stroke-dasharray="2,3" opacity="0.6"/>
    <text x="451" y="14" text-anchor="middle" fill="var(--amber)" font-family="IBM Plex Mono, monospace" font-size="9">WATERMARK</text>
  </svg>`;
}

/* ---------- vista: dashboard ---------- */
async function renderDashboard(el){
  const [stats, detections, files] = await Promise.all([
    api('/stats'),
    api('/leak-detections'),
    api('/watermarked-files'),
  ]);

  el.innerHTML = `
    <div class="hero">
      <div class="hero-label">// forma de onda — la marca vive en la zona inaudible del espectro</div>
      ${waveformSVG()}
    </div>

    <div class="grid-stats">
      <div class="stat-card"><div class="stat-value">${stats.total_tracks}</div><div class="stat-label">Canciones</div></div>
      <div class="stat-card"><div class="stat-value">${stats.total_recipients}</div><div class="stat-label">Destinatarios</div></div>
      <div class="stat-card"><div class="stat-value">${stats.total_watermarked_files}</div><div class="stat-label">Copias marcadas</div></div>
      <div class="stat-card"><div class="stat-value" style="color:${stats.total_leaks_detected > 0 ? 'var(--coral)' : 'var(--paper)'}">${stats.total_leaks_detected}</div><div class="stat-label">Filtraciones detectadas</div></div>
    </div>

    <div class="section-title">Últimas verificaciones</div>
    <div class="card">
      ${detections.length === 0 ? '<div class="empty">Todavía no se ha verificado ningún archivo. Ve a "Verificar filtración" para comprobar un archivo sospechoso.</div>' : `
      <table>
        <thead><tr><th>Fecha</th><th>Resultado</th><th>Canción</th><th>Destinatario</th><th>Código</th></tr></thead>
        <tbody>
          ${detections.slice(0, 8).map(d => `
            <tr>
              <td class="mono">${new Date(d.created_at).toLocaleString()}</td>
              <td>${d.matched ? '<span class="badge leak">FILTRACIÓN</span>' : '<span class="badge clean">SIN COINCIDENCIA</span>'}</td>
              <td>${d.track_title || '—'}</td>
              <td>${d.recipient_name || '—'}</td>
              <td class="mono">${d.extracted_code ?? '—'}</td>
            </tr>`).join('')}
        </tbody>
      </table>`}
    </div>

    <div class="section-title">Copias marcadas recientes</div>
    <div class="card">
      ${files.length === 0 ? '<div class="empty">Todavía no has generado ninguna copia. Ve a "Nueva canción" para crear la primera.</div>' : `
      <table>
        <thead><tr><th>Fecha</th><th>Canción</th><th>Destinatario</th><th>Código</th><th></th></tr></thead>
        <tbody>
          ${files.slice(0, 8).map(f => `
            <tr>
              <td class="mono">${new Date(f.created_at).toLocaleString()}</td>
              <td>${f.track_title}</td>
              <td>${f.recipient_name}</td>
              <td class="mono">${f.code}</td>
              <td><button class="download-btn" data-id="${f.id}" data-filename="${f.track_title}_${f.recipient_name}.wav" style="background:none; border:none; color:var(--amber); font-size:12px; font-weight:600; padding:0; cursor:pointer;">Descargar ↓</button></td>
            </tr>`).join('')}
        </tbody>
      </table>`}
    </div>
  `;

  el.querySelectorAll('.download-btn').forEach(btn => {
    btn.addEventListener('click', () => downloadWatermarkedFile(btn.dataset.id, btn.dataset.filename));
  });
}

/* ---------- vista: nueva canción ---------- */
async function renderNewTrack(el){
  const recipients = await api('/recipients');
  state.recipients = recipients;

  el.innerHTML = `
    <div class="card" style="max-width:520px;">
      ${recipients.length === 0 ? `<div class="empty">Primero necesitas crear al menos un destinatario en la sección "Destinatarios".</div>` : `
      <label>Título de la canción</label>
      <input type="text" id="ntTitle" placeholder="p.ej. Demo inédita" />

      <label>Artista</label>
      <input type="text" id="ntArtist" placeholder="p.ej. Tu nombre artístico" />

      <label>Destinatario</label>
      <select id="ntRecipient">
        ${recipients.map(r => `<option value="${r.id}">${r.name}</option>`).join('')}
      </select>

      <label>Archivo de audio (.wav)</label>
      <input type="file" id="ntFile" accept=".wav" />

      <button class="btn-primary btn-block" id="ntSubmit">Generar copia marcada</button>
      <div id="ntResult"></div>
      `}
    </div>
  `;

  const btn = document.getElementById('ntSubmit');
  if(!btn) return;
  btn.addEventListener('click', async () => {
    const title = document.getElementById('ntTitle').value.trim();
    const artist = document.getElementById('ntArtist').value.trim();
    const recipientId = document.getElementById('ntRecipient').value;
    const file = document.getElementById('ntFile').files[0];
    if(!title || !artist || !file){ showError('Rellena título, artista y elige un archivo .wav'); return; }

    const form = new FormData();
    form.append('title', title);
    form.append('artist', artist);
    form.append('recipient_id', recipientId);
    form.append('file', file);

    btn.textContent = 'Generando…';
    btn.disabled = true;
    try{
      const result = await api('/watermark', { method: 'POST', body: form });
      const recipientName = state.recipients.find(r => String(r.id) === String(recipientId))?.name || '';
      const filename = `${title}_${recipientName}.wav`;
      document.getElementById('ntResult').innerHTML = `
        <div class="result-panel clean">
          <div class="result-title">Copia generada — código ${result.code}</div>
          <div class="result-detail">
            <button class="download-btn" style="background:none; border:none; color:var(--teal); font-weight:600; padding:0; cursor:pointer; font-size:13px;">Descargar el archivo marcado ↓</button>
          </div>
        </div>`;
      document.querySelector('#ntResult .download-btn').addEventListener('click', () => downloadWatermarkedFile(result.id, filename));
    }catch(e){
      showError(e.message);
    }finally{
      btn.textContent = 'Generar copia marcada';
      btn.disabled = false;
    }
  });
}

/* ---------- vista: verificar ---------- */
function renderVerify(el){
  el.innerHTML = `
    <div class="card" style="max-width:520px;">
      <label>Archivo sospechoso (.wav)</label>
      <input type="file" id="vFile" accept=".wav" />
      <button class="btn-primary btn-block" id="vSubmit">Verificar archivo</button>
      <div id="vResult"></div>
    </div>
  `;

  document.getElementById('vSubmit').addEventListener('click', async () => {
    const file = document.getElementById('vFile').files[0];
    if(!file){ showError('Elige un archivo .wav primero'); return; }

    const btn = document.getElementById('vSubmit');
    const form = new FormData();
    form.append('file', file);

    btn.textContent = 'Analizando…';
    btn.disabled = true;
    try{
      const result = await api('/verify', { method: 'POST', body: form });
      const resEl = document.getElementById('vResult');
      if(result.matched){
        resEl.innerHTML = `
          <div class="result-panel leak">
            <div class="result-title">🚨 Filtración confirmada</div>
            <div class="result-detail">'${result.track_title}' — viene de <strong>${result.recipient_name}</strong> (código ${result.extracted_code})</div>
          </div>`;
      }else{
        resEl.innerHTML = `
          <div class="result-panel clean">
            <div class="result-title">Sin coincidencias</div>
            <div class="result-detail">${result.extracted_code ? `Se detectó un código (${result.extracted_code}) pero no corresponde a ningún registro.` : 'No se encontró ningún watermark en este archivo.'}</div>
          </div>`;
      }
    }catch(e){
      showError(e.message);
    }finally{
      btn.textContent = 'Verificar archivo';
      btn.disabled = false;
    }
  });
}

/* ---------- vista: destinatarios ---------- */
async function renderRecipients(el){
  const recipients = await api('/recipients');

  el.innerHTML = `
    <div class="card" style="max-width:520px; margin-bottom:24px;">
      <label>Nombre</label>
      <input type="text" id="rName" placeholder="p.ej. Estudio X, colaborador..." />
      <label>Email (opcional)</label>
      <input type="email" id="rEmail" placeholder="opcional" />
      <button class="btn-primary btn-block" id="rSubmit">Añadir destinatario</button>
    </div>

    <div class="section-title">Destinatarios existentes</div>
    <div class="card">
      ${recipients.length === 0 ? '<div class="empty">Todavía no has añadido ningún destinatario.</div>' : `
      <table>
        <thead><tr><th>Nombre</th><th>Email</th></tr></thead>
        <tbody>
          ${recipients.map(r => `<tr><td>${r.name}</td><td class="mono">${r.email || '—'}</td></tr>`).join('')}
        </tbody>
      </table>`}
    </div>
  `;

  document.getElementById('rSubmit').addEventListener('click', async () => {
    const name = document.getElementById('rName').value.trim();
    const email = document.getElementById('rEmail').value.trim();
    if(!name){ showError('Ponle un nombre al destinatario'); return; }
    try{
      await api('/recipients', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email: email || null }),
      });
      renderRecipients(el);
    }catch(e){
      showError(e.message);
    }
  });
}

/* ---------- vista: ajustes ---------- */
function renderSettings(el){
  el.innerHTML = `
    <div class="card" style="max-width:520px;">
      <div class="settings-row">
        <div>
          <label>URL de la API</label>
          <input type="text" id="sUrl" value="${state.apiUrl}" />
        </div>
      </div>
      <label>API Key</label>
      <input type="password" id="sKey" value="${state.apiKey}" placeholder="la que definiste en tu .env" />
      <button class="btn-primary btn-block" id="sSave">Guardar y comprobar conexión</button>
      <div id="sStatus" style="margin-top:14px; font-size:13px; color:var(--dim);"></div>
    </div>
  `;

  document.getElementById('sSave').addEventListener('click', async () => {
    saveConfig(document.getElementById('sUrl').value, document.getElementById('sKey').value);
    const ok = await checkConnection();
    document.getElementById('sStatus').innerHTML = ok
      ? '<span style="color:var(--teal);">Conexión correcta.</span>'
      : '<span style="color:var(--coral);">No se ha podido conectar. Revisa la URL y la API key.</span>';
  });
}

/* ---------- arranque ---------- */
(async function init(){
  checkConnection();
  navigate(state.apiKey ? 'dashboard' : 'settings');
})();
</script>
</body>
</html>
