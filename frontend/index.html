<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leak Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14171A;
    --panel:#1B1F23;
    --panel-raised:#23282D;
    --border:#2B3136;
    --paper:#ECE9E2;
    --dim:#8B9298;
    --amber:#E4A64A;
    --amber-soft:rgba(228,166,74,0.14);
    --coral:#E8604C;
    --coral-soft:rgba(232,96,76,0.14);
    --teal:#4FC1B0;
    --teal-soft:rgba(79,193,176,0.14);
    --radius:10px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter', sans-serif;
    font-size:14px;
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2,h3{ font-family:'Space Grotesk', sans-serif; margin:0; letter-spacing:-0.01em; }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  a{ color:inherit; }

  /* ---------- layout ---------- */
  .app{ display:flex; min-height:100vh; }

  .sidebar{
    width:220px;
    flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:20px 14px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    padding:6px 8px 22px 8px;
  }
  .brand svg{ flex-shrink:0; }
  .brand-text{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; letter-spacing:0.02em; }
  .brand-text .slash{ color:var(--amber); }

  .nav{ display:flex; flex-direction:column; gap:2px; flex:1; }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px;
    border-radius:8px;
    color:var(--dim);
    cursor:pointer;
    font-size:13.5px;
    font-weight:500;
    border:none;
    background:transparent;
    text-align:left;
    width:100%;
    transition:background 0.12s ease, color 0.12s ease;
  }
  .nav-item:hover{ background:var(--panel-raised); color:var(--paper); }
  .nav-item.active{ background:var(--amber-soft); color:var(--amber); }
  .nav-item svg{ flex-shrink:0; }

  .sidebar-footer{
    border-top:1px solid var(--border);
    padding-top:14px;
    margin-top:14px;
  }
  .conn-status{
    display:flex; align-items:center; gap:7px;
    font-size:11.5px; color:var(--dim);
    padding:6px 8px 10px 8px;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--dim); flex-shrink:0; }
  .dot.ok{ background:var(--teal); box-shadow:0 0 0 3px var(--teal-soft); }
  .dot.bad{ background:var(--coral); box-shadow:0 0 0 3px var(--coral-soft); }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    padding:22px 32px;
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
  }
  .content{ padding:28px 32px 60px 32px; max-width:980px; }

  /* ---------- primitives ---------- */
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
  }
  .grid-stats{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:14px;
    margin:22px 0 28px 0;
  }
  .stat-card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 18px;
    transition:transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .stat-card:hover{
    transform:translateY(-2px) scale(1.015);
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
    border-color:var(--amber);
  }
  .stat-value{ font-family:'Space Grotesk', sans-serif; font-size:26px; font-weight:700; }
  .stat-label{ color:var(--dim); font-size:12px; margin-top:4px; }

  label{ display:block; font-size:12.5px; color:var(--dim); margin:14px 0 6px 0; font-weight:500; }
  label:first-child{ margin-top:0; }
  input[type=text], input[type=password], input[type=number], input[type=email], select{
    width:100%; background:var(--panel-raised); border:1px solid var(--border);
    color:var(--paper); border-radius:7px; padding:9px 11px; font-size:13.5px;
    font-family:'Inter', sans-serif;
  }
  input:focus, select:focus{ outline:none; border-color:var(--amber); }
  input[type=file]{
    width:100%; background:var(--panel-raised); border:1px dashed var(--border);
    border-radius:7px; padding:14px 11px; font-size:13px; color:var(--dim);
  }

  button{
    font-family:'Inter', sans-serif; font-weight:600; font-size:13.5px;
    border-radius:7px; border:1px solid transparent; padding:10px 16px;
    cursor:pointer; transition:filter 0.12s ease;
  }
  button:hover{ filter:brightness(1.08); }
  button:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
  .btn-primary{ background:var(--amber); color:#1A1300; }
  .btn-ghost{ background:var(--panel-raised); color:var(--paper); border-color:var(--border); }
  .btn-block{ width:100%; margin-top:18px; }

  table{ width:100%; border-collapse:collapse; }
  th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--dim); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border);
  }
  td{ padding:10px; border-bottom:1px solid var(--border); font-size:13px; }
  tr:last-child td{ border-bottom:none; }
  .badge{
    display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px;
    font-size:11px; font-weight:600; font-family:'IBM Plex Mono', monospace;
  }
  .badge.leak{ background:var(--coral-soft); color:var(--coral); }
  .badge.clean{ background:var(--teal-soft); color:var(--teal); }
  .badge.attention{ background:var(--amber-soft); color:var(--amber); }

  .empty{ color:var(--dim); font-size:13px; padding:26px 4px; text-align:center; }

  .section-title{ font-size:12px; text-transform:uppercase; letter-spacing:0.05em; color:var(--dim); margin:30px 0 12px 0; }
  .section-title:first-child{ margin-top:0; }

  .banner{
    position:fixed; top:18px; right:18px; z-index:50;
    background:var(--panel-raised); border:1px solid var(--border); border-left:3px solid var(--coral);
    border-radius:8px; padding:12px 16px; font-size:13px; max-width:340px;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }

  .result-panel{
    border-radius:var(--radius); padding:26px; text-align:center; margin-top:20px;
  }
  .result-panel.leak{ background:var(--coral-soft); border:1px solid var(--coral); }
  .result-panel.clean{ background:var(--teal-soft); border:1px solid var(--teal); }
  .result-title{ font-family:'Space Grotesk', sans-serif; font-size:19px; font-weight:700; margin-bottom:6px; }
  .result-panel.leak .result-title{ color:var(--coral); }
  .result-panel.clean .result-title{ color:var(--teal); }
  .result-detail{ font-size:13px; color:var(--paper); opacity:0.85; }

  .hero{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px 22px 14px 22px; margin-bottom:24px;
  }
  .hero-label{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--dim); margin-bottom:10px; }

  .settings-row{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
  .settings-row > div{ flex:1; min-width:200px; }

  /* ---------- transición entre vistas ---------- */
  #content{ opacity:0; transform:translateY(6px); }
  #content.fade-in{ opacity:1; transform:translateY(0); transition:opacity 0.18s ease, transform 0.18s ease; }

  /* ---------- icono de ayuda / info ---------- */
  .info-icon{
    display:inline-flex; align-items:center; justify-content:center;
    width:16px; height:16px; border-radius:50%;
    border:1px solid var(--border); color:var(--dim);
    font-size:10.5px; font-weight:700; font-family:'IBM Plex Mono', monospace;
    cursor:pointer; margin-left:6px; flex-shrink:0;
    background:transparent;
    transition:border-color 0.12s ease, color 0.12s ease;
  }
  .info-icon:hover{ border-color:var(--amber); color:var(--amber); }

  /* ---------- modal genérico ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6);
    display:flex; align-items:center; justify-content:center;
    z-index:200; padding:20px;
  }
  .modal-box{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    max-width:480px; width:100%; padding:22px; max-height:80vh; overflow-y:auto;
  }
  .modal-title-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .modal-title{ font-family:'Space Grotesk', sans-serif; font-size:16px; font-weight:700; }
  .modal-close{
    background:none; border:none; color:var(--dim); font-size:18px; line-height:1; padding:2px 6px; cursor:pointer;
  }
  .modal-close:hover{ color:var(--paper); filter:none; }
  .modal-body{ font-size:13.5px; color:var(--paper); opacity:0.9; }
  .modal-body p{ margin:0 0 12px 0; }
  .modal-body p:last-child{ margin-bottom:0; }
  .modal-body code{ font-family:'IBM Plex Mono', monospace; background:var(--panel-raised); padding:1px 5px; border-radius:4px; }

  /* ---------- widget de chat de soporte ---------- */
  .chat-fab{
    position:fixed; bottom:24px; right:24px; z-index:100;
    width:52px; height:52px; border-radius:50%;
    background:var(--amber); color:#1A1300;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,0.45);
    border:none; cursor:pointer;
    transition:transform 0.15s ease, filter 0.15s ease;
  }
  .chat-fab:hover{ transform:scale(1.06); }
  .chat-window{
    position:fixed; bottom:88px; right:24px; z-index:100;
    width:340px; max-width:calc(100vw - 32px); height:460px; max-height:calc(100vh - 130px);
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:0 12px 32px rgba(0,0,0,0.5);
    display:flex; flex-direction:column; overflow:hidden;
    opacity:0; transform:translateY(12px) scale(0.98); pointer-events:none;
    transition:opacity 0.15s ease, transform 0.15s ease;
  }
  .chat-window.open{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .chat-header{
    padding:14px 16px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
  }
  .chat-header-title{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:13.5px; }
  .chat-header-sub{ font-size:11px; color:var(--dim); margin-top:2px; }
  .chat-messages{ flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .chat-msg{ max-width:85%; padding:8px 11px; border-radius:10px; font-size:13px; line-height:1.4; white-space:pre-wrap; }
  .chat-msg.user{ align-self:flex-end; background:var(--amber-soft); color:var(--paper); }
  .chat-msg.assistant{ align-self:flex-start; background:var(--panel-raised); color:var(--paper); }
  .chat-msg.error{ align-self:flex-start; background:var(--coral-soft); color:var(--coral); }
  .chat-typing{ align-self:flex-start; font-size:12px; color:var(--dim); font-style:italic; padding:0 2px; }
  .chat-input-row{ display:flex; gap:8px; padding:12px; border-top:1px solid var(--border); flex-shrink:0; }
  .chat-input-row textarea{
    flex:1; resize:none; background:var(--panel-raised); border:1px solid var(--border);
    color:var(--paper); border-radius:7px; padding:8px 10px; font-size:13px;
    font-family:'Inter', sans-serif; height:38px;
  }
  .chat-input-row textarea:focus{ outline:none; border-color:var(--amber); }
  .chat-input-row button{ flex-shrink:0; padding:8px 14px; }

  /* ---------- gráfica "Protection Overview" ---------- */
  .chart-card{ position:relative; margin-bottom:28px; }
  .chart-card svg{ display:block; overflow:visible; }
  .chart-point{ cursor:pointer; }
  .chart-tooltip{
    position:absolute; pointer-events:none; z-index:10;
    background:var(--panel-raised); border:1px solid var(--border); border-radius:7px;
    padding:7px 10px; font-size:12px; font-family:'IBM Plex Mono', monospace;
    box-shadow:0 6px 16px rgba(0,0,0,0.4); white-space:nowrap;
    opacity:0; transition:opacity 0.1s ease;
  }
  .chart-tooltip.visible{ opacity:1; }

  /* ---------- filtros ---------- */
  .filter-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .filter-chip{
    background:var(--panel-raised); border:1px solid var(--border); color:var(--dim);
    font-size:12px; font-weight:600; padding:6px 12px; border-radius:99px; cursor:pointer;
    transition:background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }
  .filter-chip:hover{ color:var(--paper); }
  .filter-chip.active{ background:var(--amber-soft); color:var(--amber); border-color:var(--amber); }
  .filter-dates{ display:flex; align-items:center; gap:6px; margin-left:auto; }
  .filter-dates input[type=date]{
    background:var(--panel-raised); border:1px solid var(--border); color:var(--paper);
    border-radius:7px; padding:6px 8px; font-size:12px; font-family:'Inter', sans-serif;
  }

  @media (max-width: 760px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; flex-direction:row; align-items:center; padding:12px 16px; overflow-x:auto; }
    .brand{ padding:0 14px 0 0; }
    .nav{ flex-direction:row; }
    .sidebar-footer{ display:none; }
    .grid-stats{ grid-template-columns:repeat(2, 1fr); }
    .content{ padding:20px; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <rect width="26" height="26" rx="6" fill="#E4A64A" fill-opacity="0.14"/>
        <path d="M5 15V11M9 18V8M13 20V6M17 16V10M21 14V12" stroke="#E4A64A" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <div class="brand-text">LEAK<span class="slash">//</span>TRACKER</div>
    </div>

    <nav class="nav">
      <button class="nav-item" data-view="dashboard">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="1.5" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.4"/><rect x="8.5" y="1.5" width="6" height="9" rx="1.2" stroke="currentColor" stroke-width="1.4"/><rect x="1.5" y="9.5" width="6" height="5" rx="1.2" stroke="currentColor" stroke-width="1.4"/></svg>
        Dashboard
      </button>
      <button class="nav-item" data-view="new-track">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Nueva canción
      </button>
      <button class="nav-item" data-view="verify">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8.5l3.5 3.5L14 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Verificar filtración
      </button>
      <button class="nav-item" data-view="recipients">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 14c0-2.8 2.5-5 5.5-5s5.5 2.2 5.5 5" stroke="currentColor" stroke-width="1.4"/></svg>
        Destinatarios
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="conn-status">
        <span class="dot" id="connDot"></span>
        <span id="connText">sin comprobar</span>
      </div>
      <button class="nav-item" data-view="settings" style="font-size:12px;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.5v2M8 12.5v2M14.5 8h-2M3.5 8h-2M12.5 3.5l-1.4 1.4M4.9 11.1l-1.4 1.4M12.5 12.5l-1.4-1.4M4.9 4.9L3.5 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        Ajustes de conexión
      </button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="pageTitle" style="font-size:19px;">Dashboard</h1>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
/* ---------- estado y config ---------- */
const state = {
  apiUrl: localStorage.getItem('lt_apiUrl') || 'http://localhost:8000',
  apiKey: localStorage.getItem('lt_apiKey') || '',
  view: 'dashboard',
  recipients: [],
  chatHistory: [], // solo en memoria, se pierde al recargar la página
  chatOpen: false,
  detectionsFilter: { status: 'all', from: '', to: '' },
  tracksFilter: { status: 'all' },
};

/* ---------- formato de código de watermark ----------
   El backend guarda/extrae un entero plano de 16 bits (0-65535) — esto NO
   cambia. "LT-XXXXXX" es solo un formato de visualización para que el
   código sea más legible en el dashboard. */
function formatCode(code){
  if(code === null || code === undefined) return '—';
  return 'LT-' + String(code).padStart(6, '0');
}

function saveConfig(url, key){
  state.apiUrl = url.replace(/\/$/, '');
  state.apiKey = key;
  localStorage.setItem('lt_apiUrl', state.apiUrl);
  localStorage.setItem('lt_apiKey', state.apiKey);
}

async function api(path, options = {}){
  const res = await fetch(state.apiUrl + path, {
    ...options,
    headers: {
      ...(options.headers || {}),
      'X-API-Key': state.apiKey,
    },
  });
  if(!res.ok){
    let detail = res.statusText;
    try{ detail = (await res.json()).detail || detail; }catch(e){}
    throw new Error(detail);
  }
  const contentType = res.headers.get('content-type') || '';
  return contentType.includes('application/json') ? res.json() : res;
}

async function downloadWatermarkedFile(id, filename){
  try{
    const res = await api(`/watermarked-files/${id}/download`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }catch(e){
    showError(e.message);
  }
}

function showError(msg){
  const el = document.createElement('div');
  el.className = 'banner';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

/* ---------- modal genérico ---------- */
function openModal(title, bodyHtml){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'activeModal';
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-title-row">
        <div class="modal-title">${title}</div>
        <button class="modal-close" aria-label="Cerrar">✕</button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
    </div>
  `;
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });
  overlay.querySelector('.modal-close').addEventListener('click', closeModal);
  document.addEventListener('keydown', modalEscHandler);
  document.body.appendChild(overlay);
}

function modalEscHandler(e){
  if(e.key === 'Escape') closeModal();
}

function closeModal(){
  const existing = document.getElementById('activeModal');
  if(existing) existing.remove();
  document.removeEventListener('keydown', modalEscHandler);
}

function watermarkExplainerHtml(){
  return `
    <p><strong>¿Qué es la marca de agua?</strong> Cuando generas una copia de una canción para un destinatario, LeakTracker incrusta un tono inaudible dentro del propio audio — no se nota al escucharlo, pero el sistema puede leerlo del archivo.</p>
    <p><strong>¿Cómo se genera el código?</strong> Se usa una técnica llamada FSK (Frequency Shift Keying): cada bit del código se codifica como un tonito muy corto en una frecuencia ultrasónica (18.5-19.5 kHz), fuera del rango que el oído humano percibe con claridad. El código interno es un número de 16 bits, y en el dashboard se muestra en formato legible <code>LT-XXXXXX</code> (por ejemplo <code>LT-045627</code>).</p>
    <p><strong>¿Cómo identifica una filtración?</strong> Cada copia marcada tiene un código distinto ligado a un destinatario concreto. Si esa canción se filtra, subes el archivo sospechoso en "Verificar filtración": el sistema extrae el tono inaudible, recupera el código y te dice exactamente a quién se le había enviado esa copia.</p>
  `;
}

async function checkConnection(){
  const dot = document.getElementById('connDot');
  const text = document.getElementById('connText');
  try{
    await api('/stats');
    dot.className = 'dot ok';
    text.textContent = 'conectado';
    return true;
  }catch(e){
    dot.className = 'dot bad';
    text.textContent = 'sin conexión';
    return false;
  }
}

/* ---------- widget de chat de soporte con IA ---------- */
function renderChatWidget(){
  const fab = document.createElement('button');
  fab.className = 'chat-fab';
  fab.id = 'chatFab';
  fab.setAttribute('aria-label', 'Abrir chat de soporte');
  fab.innerHTML = `<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 5h14a1.5 1.5 0 0 1 1.5 1.5v7A1.5 1.5 0 0 1 18 15h-8l-4 3v-3H4A1.5 1.5 0 0 1 2.5 13.5v-7A1.5 1.5 0 0 1 4 5z" stroke="#1A1300" stroke-width="1.6" stroke-linejoin="round"/></svg>`;

function toggleChat(){
  state.chatOpen = !state.chatOpen;
  document.getElementById('chatWindow').classList.toggle('open', state.chatOpen);
  if(state.chatOpen) document.getElementById('chatInput').focus();
}

function appendChatMessage(role, text){
  const container = document.getElementById('chatMessages');
  const el = document.createElement('div');
  el.className = `chat-msg ${role}`;
  el.textContent = text;
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;
}

async function sendChatMessage(){
  const input = document.getElementById('chatInput');
  const message = input.value.trim();
  if(!message) return;

  appendChatMessage('user', message);
  input.value = '';
  input.disabled = true;
  const sendBtn = document.getElementById('chatSendBtn');
  sendBtn.disabled = true;

  const container = document.getElementById('chatMessages');
  const typing = document.createElement('div');
  typing.className = 'chat-typing';
  typing.textContent = 'Escribiendo…';
  container.appendChild(typing);
  container.scrollTop = container.scrollHeight;

  try{
    const result = await api('/support-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message,
        history: state.chatHistory.slice(-10),
      }),
    });
    typing.remove();
    appendChatMessage('assistant', result.reply);
    state.chatHistory.push({ role: 'user', content: message });
    state.chatHistory.push({ role: 'assistant', content: result.reply });
  }catch(e){
    typing.remove();
    appendChatMessage('error', `No se pudo obtener respuesta: ${e.message}`);
  }finally{
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

/* ---------- waveform hero (elemento firma) ---------- */
function waveformSVG(){
  // Genera una forma de onda pseudo-aleatoria pero determinista, con un
  // tramo marcado como "zona de watermark" (alta frecuencia, poca amplitud)
  const bars = [];
  const n = 64;
  for(let i = 0; i < n; i++){
    const inWatermarkZone = i >= 46 && i <= 54;
    let h;
    if(inWatermarkZone){
      h = 6 + (i % 3) * 2; // tramo de watermark: bajito y regular
    }else{
      h = 8 + Math.round(18 * Math.abs(Math.sin(i * 0.45)) + (i % 7));
    }
    const x = 6 + i * 9;
    const color = inWatermarkZone ? 'var(--amber)' : 'var(--dim)';
    bars.push(`<rect x="${x}" y="${34 - h/2}" width="4" height="${h}" rx="1.5" fill="${color}" opacity="${inWatermarkZone ? '1' : '0.55'}"/>`);
  }
  return `
  <svg width="100%" height="70" viewBox="0 0 590 68" preserveAspectRatio="xMidYMid meet">
    ${bars.join('')}
    <line x1="418" y1="4" x2="418" y2="60" stroke="var(--amber)" stroke-width="1" stroke-dasharray="2,3" opacity="0.6"/>
    <line x1="484" y1="4" x2="484" y2="60" stroke="var(--amber)" stroke-width="1" stroke-dasharray="2,3" opacity="0.6"/>
    <text x="451" y="14" text-anchor="middle" fill="var(--amber)" font-family="IBM Plex Mono, monospace" font-size="9">WATERMARK</text>
  </svg>`;
}

/* ---------- gráfica "Protection Overview" ---------- */
function buildDailySeries(files){
  if(files.length === 0) return [];

  const dayKey = (iso) => iso.slice(0, 10);
  const counts = {};
  files.forEach(f => {
    const key = dayKey(f.created_at);
    counts[key] = (counts[key] || 0) + 1;
  });

  const sortedDays = Object.keys(counts).sort();
  const start = new Date(sortedDays[0] + 'T00:00:00');
  const end = new Date(sortedDays[sortedDays.length - 1] + 'T00:00:00');

  const series = [];
  let cumulative = 0;
  for(let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)){
    const key = d.toISOString().slice(0, 10);
    cumulative += counts[key] || 0;
    series.push({ date: key, value: cumulative });
  }
  return series;
}

function renderProtectionChart(series){
  const width = 600, height = 160, padX = 10, padY = 16;
  const maxValue = Math.max(...series.map(p => p.value), 1);
  const stepX = series.length > 1 ? (width - padX * 2) / (series.length - 1) : 0;

  const points = series.map((p, i) => {
    const x = padX + i * stepX;
    const y = height - padY - ((p.value / maxValue) * (height - padY * 2));
    return { ...p, x, y };
  });

  const linePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const areaPath = `${linePath} L${points[points.length - 1].x.toFixed(1)},${height - padY} L${points[0].x.toFixed(1)},${height - padY} Z`;

  const circles = points.map(p => `
    <circle class="chart-point" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="9" fill="transparent"
      data-date="${p.date}" data-value="${p.value}"></circle>
    <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.5" fill="var(--amber)" pointer-events="none"></circle>
  `).join('');

  return `
    <svg width="100%" height="${height}" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
      <path d="${areaPath}" fill="var(--amber-soft)" stroke="none"></path>
      <path d="${linePath}" fill="none" stroke="var(--amber)" stroke-width="2"></path>
      ${circles}
    </svg>
    <div class="chart-tooltip" id="chartTooltip"></div>
  `;
}

function wireChartTooltip(cardEl){
  const tooltip = cardEl.querySelector('#chartTooltip');
  if(!tooltip) return;
  cardEl.querySelectorAll('.chart-point').forEach(point => {
    point.addEventListener('mousemove', (e) => {
      const rect = cardEl.getBoundingClientRect();
      const date = new Date(point.dataset.date + 'T00:00:00').toLocaleDateString();
      tooltip.textContent = `${date} · ${point.dataset.value} copias`;
      tooltip.style.left = `${e.clientX - rect.left + 12}px`;
      tooltip.style.top = `${e.clientY - rect.top - 30}px`;
      tooltip.classList.add('visible');
    });
    point.addEventListener('mouseleave', () => tooltip.classList.remove('visible'));
  });
}

/* ---------- "Top Tracks": canciones por nº de copias distribuidas ---------- */
function buildTopTracks(tracks, files, detections){
  return tracks.map(track => {
    const trackFiles = files.filter(f => f.track_title === track.title);
    const trackDetections = detections.filter(d => d.track_title === track.title);
    const hasMatch = trackDetections.some(d => d.matched);
    const hasCheckedClean = trackDetections.length > 0 && !hasMatch;

    let status = 'protected';
    if(hasMatch) status = 'leak';
    else if(hasCheckedClean) status = 'attention';

    return {
      title: track.title,
      artist: track.artist,
      copies: trackFiles.length,
      status,
    };
  }).sort((a, b) => b.copies - a.copies);
}

  el.innerHTML = `
    <div class="card" style="max-width:520px; margin-bottom:24px;">
      <label>Nombre</label>
      <input type="text" id="rName" placeholder="p.ej. Estudio X, colaborador..." />
      <label>Email (opcional)</label>
      <input type="email" id="rEmail" placeholder="opcional" />
      <button class="btn-primary btn-block" id="rSubmit">Añadir destinatario</button>
    </div>

    <div class="section-title">Destinatarios existentes</div>
    <div class="card">
      ${recipients.length === 0 ? '<div class="empty">Todavía no has añadido ningún destinatario.</div>' : `
      <table>
        <thead><tr><th>Nombre</th><th>Email</th></tr></thead>
        <tbody>
          ${recipients.map(r => `<tr><td>${r.name}</td><td class="mono">${r.email || '—'}</td></tr>`).join('')}
        </tbody>
      </table>`}
    </div>
  `;

  document.getElementById('rSubmit').addEventListener('click', async () => {
    const name = document.getElementById('rName').value.trim();
    const email = document.getElementById('rEmail').value.trim();
    if(!name){ showError('Ponle un nombre al destinatario'); return; }
    try{
      await api('/recipients', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email: email || null }),
      });
      renderRecipients(el);
    }catch(e){
      showError(e.message);
    }
  });
}

/* ---------- vista: ajustes ---------- */
function renderSettings(el){
  el.innerHTML = `
    <div class="card" style="max-width:520px;">
      <div class="settings-row">
        <div>
          <label>URL de la API</label>
          <input type="text" id="sUrl" value="${state.apiUrl}" />
        </div>
      </div>
      <label>API Key</label>
      <input type="password" id="sKey" value="${state.apiKey}" placeholder="la que definiste en tu .env" />
      <button class="btn-primary btn-block" id="sSave">Guardar y comprobar conexión</button>
      <div id="sStatus" style="margin-top:14px; font-size:13px; color:var(--dim);"></div>
    </div>
  `;

  document.getElementById('sSave').addEventListener('click', async () => {
    saveConfig(document.getElementById('sUrl').value, document.getElementById('sKey').value);
    const ok = await checkConnection();
    document.getElementById('sStatus').innerHTML = ok
      ? '<span style="color:var(--teal);">Conexión correcta.</span>'
      : '<span style="color:var(--coral);">No se ha podido conectar. Revisa la URL y la API key.</span>';
  });
}

/* ---------- arranque ---------- */
(async function init(){
  renderChatWidget();
  checkConnection();
  navigate(state.apiKey ? 'dashboard' : 'settings');
})();
</script>
</body>
</html>
